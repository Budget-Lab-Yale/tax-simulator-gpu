# Wealth-financing channel. Read by src/taxmodel/years/wealth_arithmetic.py.
#
# A transmission channel: how tax paid above baseline during life is financed out
# of wealth, and drains into the estate and capital income bases. The wealth tax
# avoidance elasticities and concealment shares are in the behavior leg
# (src/taxmodel/behavior/wealth/avoidance.py).
_channel:
  role: transmission

#-------------------------------------------------------------------------------
# Structural
#-------------------------------------------------------------------------------

cap_flows_pt_weight:
  value: 0.2
  kind: structural
  note: >
    Weight on pass-through flows in the capital income bundle, for both the MTR
    bump and the wealth haircut. Pure capital flows carry 1.0. It matches the raw
    pass-through list in src/data/economy.R, so change both together. The corporate
    channel reads it through wealth_cap_flows_pt_weight().

financing_profile:
  value: default
  kind: calibrated
  pointer_root: config/calibrations/wealth_profiles
  set: '2026-07-07'
  target: >
    Persistent-flow anchor calibration of the saving surface
    s(age, net-worth percentile) = 1 - MPC out of a PERSISTENT net income
    change (not the one-year transitory MPC): bridge formula
    s(p) = 1 - eps * (C/Y)(p) with eps ~ 0.7 (Straub 2019) and C/Y shares from
    Mian-Straub-Sufi (2021), cross-checked against the Fagereng-Holm-Natvik
    transitory-MPC gradient. Wealth-rank anchors run s ~ 0.10 at the bottom
    decile to 0.80 at the top percentile, age-tilted (full surface spans
    [0.04, 0.80] across 18-80 x 100 cells, monotone in percentile). Memo:
    other/wealth_dynamics/default_s_calibration.md.
  derived_under:
    macro_projections: '2026022522'
  invalidated_by:
    - config/calibrations/wealth_profiles/default/s.csv
  invalidated_by_hashes:
    config/calibrations/wealth_profiles/default/s.csv: 05e353bfd1a82c9135a4af1b07ebac8f
  rederive: other/wealth_dynamics/write_profiles.py
  # The hashes above watch the default profile's tables, which is what this entry
  # can see. A scenario pointing at another profile folder takes its provenance
  # from that folder's provenance.yaml, which is recorded but not compared at
  # parse time.
  note: >
    Points to a profile folder under config/calibrations/wealth_profiles/, holding
    s.csv, the per-cell saving share, and optionally M.csv, the within-age
    transition matrix. The default profile ships no M.csv, which means the
    identity: every household keeps its wealth percentile. 'none'
    disables the channel and 'flat:<s>' is shorthand for a constant share and
    an identity transition. Generated by
    s_default() in other/wealth_dynamics/write_profiles.py.

n_pctiles:
  value: 100
  kind: structural
  role: state
  note: >
    Number of within-age net worth percentile bins, of equal headcount weight,
    the bathtub's cells are cut into.

fmax:
  value: 0.9
  kind: structural
  note: >
    Clamp on the per-record gross asset shrink, symmetric so that a tax cut scales
    wealth up and a hike scales it down. The shrink runs around 1% of wealth in
    normal operation and rarely binds, but it can for a payer of low net worth and
    high income.

r_total_additive_delta:
  value: 0.0
  kind: structural
  note: >
    Shift applied to the whole return path, in decimal percentage points, for a
    sensitivity test. The central path is nominal GDP per capita growth: the
    Macro-Projections gdp series divided by the tax-unit population counts,
    year-over-year. (The gdp_c series is the consumption component of GDP, C in
    Y = C + I + G + NX, and is not used here.)
