---
indexation_defaults:
  i_measure:
    '1986': cpi
    '2017': chained_cpi
  i_base_year:
    '2014': 2017
  i_direction: 0
  i_increment: 1000

filing_status_mapper:
  kg_loss_limit:
    '1': kg_loss_limit_married
    '2': kg_loss_limit_married
    '3': kg_loss_limit_married / 2
    '4': kg_loss_limit_married
  bus_loss_limit:
    '1': bus_loss_limit_married / 2
    '2': bus_loss_limit_married
    '3': bus_loss_limit_married / 2
    '4': bus_loss_limit_married / 2
  auto_int_ded_po_thresh:
    '1': auto_int_ded_po_thresh_single
    '2': auto_int_ded_po_thresh_single * 2
    '3': auto_int_ded_po_thresh_single
    '4': auto_int_ded_po_thresh_single

# Maxmimum deductible capital loss, joint returns
kg_loss_limit_married:
  value: 3000
  
  # Share of capital gains excluded from AGI
kg_excl_rate:
  value: 0
  
# Maximum deductible business loss
bus_loss_limit_married:
  value:
    '2014': Inf
    '2022': 500000
    '2026': 500000
  i_measure: default
  # OBBBA made the limit permanent and moved its base year to 2024 from 2026
  # on (IRC 461(l)(3)(C)).
  i_base_year:
    '2014': 2017
    '2026': 2024
  i_direction: default
  # The statute rounds the $250,000 single amount to the nearest $1,000 and
  # doubles it for joint returns, so the joint amount rounds to $2,000.
  i_increment: 2000
  
# Year during and after which a divorce does not generate taxable/deductible alimony
alimony_repeal_year:
  value: 
    '2014': Inf
    '2018': 2018
    '2025': Inf

# Unemployment compensation excluded from gross income, per return. ARPA
# section 9042 (IRC 85(c)): up to $10,200 per person of 2020 unemployment
# compensation, for returns with modified AGI (AGI figured without the
# exclusion) under $150,000, any filing status. The model has one unemployment
# amount per return, so the limit is applied per return: on a joint return
# where both spouses received benefits the exclusion is understated by up to
# $10,200 (the bound applies only to married filers reporting more than
# $10,200 of unemployment compensation).
ui_excl_limit:
  value:
    '2014': 0
    '2020': 10200
    '2021': 0

# Modified AGI at or above which no unemployment compensation is excluded
ui_excl_magi_limit:
  value: 150000

# Maximum tuition and fees deduction
tuition_ded_limit:
  value: 
    '2014': Inf
    '2021': 0
    
# Maximum domestic production activities deduction
dpad_limit:
  value:
    '2014': Inf
    '2018': 0

# Maximum amount of auto loan interest deductible from gross income
auto_int_ded_limit:
  value:
    '2014': 0
    '2025': 10000
    '2029': 0

# Threshold above which auto loan interest deduction begins to phase out, non-joint returns
auto_int_ded_po_thresh_single:
  value:
    '2014': Inf
    '2025': 100000
    '2029': Inf

# Phaseout rate for auto loan interest deduction 
auto_int_ded_po_rate:
  value:
    '2014': 0
    '2025': 0.2
    '2029': 0
    
# Whether auto interest is only deductible for new cars
auto_int_ded_new:
  value:
    '2014': 0
    '2025': 1
    '2029': 0
