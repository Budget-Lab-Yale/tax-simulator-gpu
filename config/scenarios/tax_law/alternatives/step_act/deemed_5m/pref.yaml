---
# STEP Act (Van Hollen, 2023 text, moved to a 2027 start): gains on a
# decedent's assets are deemed realized on the final return, with the first
# $5,000,000 of gain per decedent keeping the step-up in basis, as the bill's
# basis rules provide at death. The married amount is double, which also
# serves as the surviving-spouse portability amount through the widowhood
# blend. Section 121 stays on top, matching the bill. Rates are current law.
#
# Not modeled: the $30M farm layer (no farm asset class), the gift and trust
# deemed-sale triggers (small, mostly timing), the indexing base year (the
# exclusion is $5M in 2027 and follows the model's projected chained CPI from
# there, floored to $10,000 steps per the bill's rounding rule; the 2023
# text's earlier base year would start it higher), and the 15-year
# installment option (shifts receipts, not liability).

kg_death_regime_equities:
  value:
    '2014': 0
    '2027': 2
