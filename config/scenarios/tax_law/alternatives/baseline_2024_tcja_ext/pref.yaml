---
indexation_defaults:
  i_measure:
    '1986': cpi
    '2017': chained_cpi
  i_base_year:
    '2014': [1992, 1992, 2012]
    '2018': [2017, 2017, 2017]
  i_direction: [-1, -1, -1]
  i_increment: [50, 50, 50]

filing_status_mapper:
  brackets:
    '1': brackets_single
    '2': brackets_married
    '3': brackets_married / 2
    '4': brackets_head

# Whether to tax long-term capital gains and qualified dividends at ordinary rates
tax_at_ord:
  value: 0

# Whether to remove the ordinary-rate ceiling on preferred-rate income (the
# Schedule D worksheet's "not more than ordinary" limit). 0 = keep the limit
# (current law); 1 = let the preferred rate exceed the ordinary rate.
no_ord_cap:
  value: 0

# Preferred tax rate schedule
rates:
  value: [0.0, 0.15, 0.20]

# Brackets for preferred-rate income, single filers
brackets_single:
  value:
    '2014': [0, 22100, 400000]
    '2018': [0, 38600, 425800]
  i_measure: default
  i_base_year: default
  i_direction: default
  # Under the TCJA the single zero rate amount is half the joint amount, which
  # is rounded down to $50, so it is rounded down to $25 here.
  i_increment:
    '2014': [25, 25, 25]
    '2018': [25, 25, 50]

# Brackets for preferred-rate income, joint filers
brackets_married:
  value:
    '2014': [0, 44200, 450000]
    '2018': [0, 77200, 479000]
  i_measure: default
  i_base_year: default
  i_direction: default
  i_increment: default
  
# Brackets for preferred-rate income, head of household filers
brackets_head:
  value:
    '2014': [0, 29600, 425000]
    '2018': [0, 51700, 452400]
  i_measure: default
  i_base_year: default
  i_direction: default
  i_increment: default

# Tax rate on Section 1250 unrecapture gain
unrecapture_rate: 
  value: 0.25

# Tax rate on collectibles gain
collectibles_rate:
  value: 0.28


