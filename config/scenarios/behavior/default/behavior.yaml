# Behavior leg -- default layer: no response at all.
#
# This is the counterfactual the whole model is measured against. A scenario
# resolving to this layer is a pure law change: taxpayers are taken exactly as
# Tax-Data reports them, and the conventional pass differs from the static pass
# only through the mechanical channels (corporate incidence and wealth
# financing), which belong to the economy leg.
#
# Every behavioral margin still runs, at its neutral values, so this layer and
# a responding one share one compiled program. An alternative under alternatives/ replaces either section here
# whole. See config/scenarios/README.md for the shape.

kg_dynamics: none

margins: {}
