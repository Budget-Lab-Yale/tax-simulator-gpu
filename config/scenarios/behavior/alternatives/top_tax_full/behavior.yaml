# Behavior leg alternative -- top_tax_full
#
# The full response stack used for the top-tax work: the gains realization model, income
# conversion into the gain pool, entity shifting, income evasion, charitable
# giving at -0.5, and the estate reporting response. Every margin except the
# wealth-tax concealment, which only applies when there is a wealth tax to
# conceal from.

kg_dynamics:
  realization: config/calibrations/kg/realization.yaml
  conversion: config/calibrations/kg/conversion.yaml

margins:
  entity_shifting:
    semi_elasticity: 0.6313333333333334
    distributed_share: 0.45
    retained_deferral_proxy: 0.25
  evasion:
    elasticity_sole_prop_and_farm: 0.046
    elasticity_pass_through: 0.052
    elasticity_rent: 0.04
    top_end_multiplier: 1.0
    max_adjustment: 1.0
  charity:
    elasticity: -0.5
    max_percent_change: 1.0
  estate:
    estate_reporting_elasticity: 0.16
