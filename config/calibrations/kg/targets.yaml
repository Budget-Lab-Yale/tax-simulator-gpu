# What we believe about how realizations respond to the tax rate on gains.
#
# These two numbers are the human-owned facts of the capital-gains model.
# The numbers the model runs on -- the elasticity parameter inside the
# realization choice, and the share of a year's realizations that can be
# retimed -- are not here: the calibrate command solves for them and
# writes them to realization.yaml, which nobody edits by hand.
#
# How each target is measured is not configurable and is not in this file.
# It is written down in src/taxmodel/calibration/targets.py: the permanent
# target is read ten years into a full simulation under a five point
# rise in the gains rate, the transitory target is read in the year such a
# rise is announced, and both are converted through the 0.238 top rate on
# long-term gains.
#
# A scenario that wants to run on different beliefs points at its own copy
# of this file from its behavior leg and calibrates against that. This one
# is the shared default belief.

permanent_realization_elasticity:
  value: -0.6
  source: >
    Author's convention, carried over from the R model unchanged: a
    long-run elasticity of realizations with respect to the tax rate on
    gains of -0.6, evaluated at the 0.238 top rate. It is measured as the
    log change in realizations per unit change in the rate, times 0.238,
    so it is a semi-elasticity of about 2.5 per unit of rate. It is not an
    elasticity with respect to the net-of-tax price; read that way the
    same response would be about 2.

transitory_realization_elasticity:
  value: 1.2
  source: >
    Author's rule of thumb, carried over from the R model unchanged: twice
    the permanent magnitude with the sign flipped, because a rate increase
    people see coming pulls realizations forward rather than changing how
    much is ever realized.
